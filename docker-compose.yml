services:
  web:
    build: .
    container_name: video-parser-site
    restart: always
    ports:
      - "8051:8051"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./logs:/app/logs
      - ./downloads:/app/downloads
    environment:
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY:-change-me-in-prod}
      - DOUYIN_COOKIE=${DOUYIN_COOKIE:-}
      - DOUBAO_COOKIE=${DOUBAO_COOKIE:-}
      - YUANBAO_COOKIE=${YUANBAO_COOKIE:-}
      - XIAOHONGSHU_COOKIE=${XIAOHONGSHU_COOKIE:-}
